name: Content, corpus and engine checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run test:corpus
      - name: Ensure incomplete content fails publication gate
        shell: bash
        run: |
          if python3 tools/release_gate.py; then
            echo 'All release criteria are met — manual deployment remains a separate operation.'
          else
            echo 'Release locked: incomplete content must not be deployed.'
          fi
